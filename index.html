    document.getElementById("noteSave").addEventListener("click", saveNote);
    document.getElementById("noteCancel").addEventListener("click", closeNoteModal);
    document.getElementById("noteDelete").addEventListener("click", deleteNote);
    noteOverlay.addEventListener("click", (e) => { if (e.target === noteOverlay) closeNoteModal(); });
    document.addEventListener("keydown", (e) => {
      if (noteOverlay.classList.contains("hidden")) return;
      if (e.key === "Escape") closeNoteModal();
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) saveNote();
    });

    /* ============================================================
       Timelines (project-wise Gantt)
       ============================================================ */
    function loadTimelines() {
      try { const r = localStorage.getItem(TIMELINES_KEY); if (r) return JSON.parse(r); } catch (e) {}
      return [];
    }
    function saveTimelines() {
      try { localStorage.setItem(TIMELINES_KEY, JSON.stringify(timelines)); } catch (e) {}
    }

    function renderTimelinesSidebar() {
      const el = document.getElementById("timelineList");
      if (!el) return;
      el.innerHTML = "";
      if (!timelines.length) {
        el.innerHTML = `<div class="project-empty">No timelines yet. Click + to add one.</div>`;
        return;
      }
      timelines.forEach((tl) => {
        const p = projectById(tl.projectId);
        const dot = p ? paletteAt(p.colorIdx).dot : "#9aa0a6";
        const row = document.createElement("button");
        row.className = "project-item" + (currentView === "timelines" && currentTimelineId === tl.id ? " active" : "");
        row.innerHTML = `
          <span class="project-dot" style="background:${dot}"></span>
          <span class="project-name">${escapeHtml(tl.name)}</span>
          <span class="project-more" title="Timeline options">⋯</span>`;
        row.addEventListener("click", (e) => {
          if (e.target.classList.contains("project-more")) {
            e.stopPropagation();
            openTimelineModal(tl.id);
          } else {
            selectView("timelines", tl.id);
          }
        });
        el.appendChild(row);
      });
    }

    function renderTimelineView() {
      const body = document.getElementById("timelineBody");
      const actions = document.getElementById("timelineActions");
      const titleEl = document.getElementById("timelineTitle");
      const pillEl = document.getElementById("timelineProjectPill");
      if (!body) return;
      body.innerHTML = "";
      actions.innerHTML = "";
      pillEl.innerHTML = "";

      if (!timelines.length) {
        titleEl.textContent = "Timelines";
        body.innerHTML = `<div class="tl-empty">No timelines yet.<br>Create a project Gantt chart to plan work over time.</div>`;
        const add = document.createElement("button");
        add.className = "btn-primary";
        add.textContent = "＋ Add timeline";
        add.onclick = () => openTimelineModal(null);
        actions.appendChild(add);
        return;
      }

      let tl = timelines.find((x) => x.id === currentTimelineId) || timelines[0];
      currentTimelineId = tl.id;
      titleEl.textContent = tl.name;
      const p = projectById(tl.projectId);
      if (p) pillEl.innerHTML = pillHTML(p.name, paletteAt(p.colorIdx));

      const addBar = document.createElement("button");
      addBar.className = "btn-primary";
      addBar.textContent = "＋ Add task";
      addBar.onclick = () => openBarModal(tl.id, null);
      actions.appendChild(addBar);

      const edit = document.createElement("button");
      edit.className = "btn-secondary";
      edit.textContent = "Edit";
      edit.onclick = () => openTimelineModal(tl.id);
      actions.appendChild(edit);

      body.appendChild(buildGantt(tl));
    }

    function buildGantt(tl) {
      const bars = (tl.bars || [])
        .filter((b) => b.start && b.end)
        .slice()
        .sort((a, b) => a.start.localeCompare(b.start));

      const wrap = document.createElement("div");
      wrap.className = "gantt-wrap";
      if (!bars.length) {
        wrap.style.border = "none";
        wrap.innerHTML = `<div class="tl-empty">No tasks in this timeline yet.<br>Click “＋ Add task” to add the first Gantt bar.</div>`;
        return wrap;
      }

      const dayMs = 86400000;
      const dayW = 34, rowH = 40;
      const minISO = bars.reduce((m, b) => (b.start < m ? b.start : m), bars[0].start);
      const maxISO = bars.reduce((m, b) => (b.end > m ? b.end : m), bars[0].end);
      const start = fromISODate(minISO); start.setDate(start.getDate() - 1);
      const end = fromISODate(maxISO); end.setDate(end.getDate() + 1);
      const totalDays = Math.round((startOfDay(end) - startOfDay(start)) / dayMs) + 1;
      const todayISO = toISODate(startOfDay(new Date()));
      const DOW = ["S", "M", "T", "W", "T", "F", "S"];

      // Left column (task labels)
      const left = document.createElement("div");
      left.className = "gantt-left";
      const corner = document.createElement("div");
      corner.className = "gantt-corner";
      corner.textContent = "Task";
      left.appendChild(corner);
      const leftInner = document.createElement("div");
      bars.forEach((b) => {
        const rl = document.createElement("div");
        rl.className = "gantt-rowlabel";
        rl.textContent = b.label;
        rl.title = b.label;
        rl.onclick = () => openBarModal(tl.id, b.id);
        leftInner.appendChild(rl);
      });
      left.appendChild(leftInner);
      wrap.appendChild(left);

      // Right (scrollable chart)
      const right = document.createElement("div");
      right.className = "gantt-right";
      const canvas = document.createElement("div");
      canvas.className = "gantt-canvas";
      canvas.style.width = totalDays * dayW + "px";

      const headwrap = document.createElement("div");
      headwrap.className = "gantt-headwrap";
      const monthsRow = document.createElement("div");
      monthsRow.className = "gantt-months";
      const daysRow = document.createElement("div");
      daysRow.className = "gantt-days";
      const segs = [];
      for (let i = 0; i < totalDays; i++) {
        const d = new Date(start); d.setDate(d.getDate() + i);
        const iso = toISODate(d);
        const wd = d.getDay();
        const day = document.createElement("div");
        day.className = "gantt-day" + (wd === 0 || wd === 6 ? " weekend" : "") + (iso === todayISO ? " today" : "");
        day.style.width = dayW + "px";
        day.innerHTML = `<span>${DOW[wd]}</span><span>${d.getDate()}</span>`;
        daysRow.appendChild(day);
        const lbl = `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
        if (segs.length && segs[segs.length - 1].label === lbl) segs[segs.length - 1].days++;
        else segs.push({ label: lbl, days: 1 });
      }
      segs.forEach((s) => {
        const mc = document.createElement("div");
        mc.className = "gantt-month";
        mc.style.width = s.days * dayW + "px";
        mc.textContent = s.label;
        monthsRow.appendChild(mc);
      });
      headwrap.appendChild(monthsRow);
      headwrap.appendChild(daysRow);
      canvas.appendChild(headwrap);

      // Rows + bars
      const rows = document.createElement("div");
      rows.className = "gantt-rows";
      rows.style.height = bars.length * rowH + "px";
      bars.forEach(() => {
        const gr = document.createElement("div");
        gr.className = "gantt-gridrow";
        rows.appendChild(gr);
      });
      const todayOffset = Math.round((startOfDay(fromISODate(todayISO)) - startOfDay(start)) / dayMs);
      if (todayOffset >= 0 && todayOffset < totalDays) {
        const tline = document.createElement("div");
        tline.className = "gantt-today-line";
        tline.style.left = todayOffset * dayW + dayW / 2 + "px";
        rows.appendChild(tline);
      }
      bars.forEach((b, i) => {
        const s = startOfDay(fromISODate(b.start));
        const e = startOfDay(fromISODate(b.end));
        const offset = Math.round((s - startOfDay(start)) / dayMs);
        const dur = Math.max(1, Math.round((e - s) / dayMs) + 1);
        const prog = Math.max(0, Math.min(100, b.progress || 0));
        const bar = document.createElement("div");
        bar.className = "gantt-bar";
        bar.style.left = offset * dayW + 3 + "px";
        bar.style.width = dur * dayW - 6 + "px";
        bar.style.top = i * rowH + 7 + "px";
        bar.style.background = b.color || "#6b5ecb";
        bar.innerHTML = `<span class="bar-progress" style="width:${prog}%"></span><span class="bar-label">${escapeHtml(b.label)} · ${prog}%</span>`;
        bar.title = `${b.label}\n${fmtShortDate(b.start)} → ${fmtShortDate(b.end)} · ${prog}%`;
        bar.onclick = () => openBarModal(tl.id, b.id);
        rows.appendChild(bar);
      });
      canvas.appendChild(rows);
      right.appendChild(canvas);
      wrap.appendChild(right);

      // Keep the left labels vertically aligned with the scrolling chart.
      right.addEventListener("scroll", () => {
        leftInner.style.transform = `translateY(${-right.scrollTop}px)`;
      });

      return wrap;
    }

    /* ---------- Timeline modal ---------- */
    let editingTimelineId = null;
    const timelineOverlay = document.getElementById("timelineModalOverlay");
    function populateTimelineProjectSelect(sel) {
      const el = document.getElementById("timelineProjectSelect");
      el.innerHTML =
        `<option value="">No project</option>` +
        projects.map((p) => `<option value="${p.id}"${p.id === sel ? " selected" : ""}>${escapeHtml(p.name)}</option>`).join("");
      el.value = sel || "";
    }
    function openTimelineModal(id) {
      editingTimelineId = id || null;
      const tl = id ? timelines.find((x) => x.id === id) : null;
      document.getElementById("timelineModalTitle").textContent = tl ? "Edit timeline" : "Add timeline";
      document.getElementById("timelineNameInput").value = tl ? tl.name : "";
      populateTimelineProjectSelect(tl ? tl.projectId : currentProjectId || "");
      document.getElementById("timelineDelete").classList.toggle("hidden", !tl);
      timelineOverlay.classList.remove("hidden");
      setTimeout(() => document.getElementById("timelineNameInput").focus(), 50);
    }
    function closeTimelineModal() {
      timelineOverlay.classList.add("hidden");
      editingTimelineId = null;
    }
    function saveTimeline() {
      const name = document.getElementById("timelineNameInput").value.trim();
      const projectId = document.getElementById("timelineProjectSelect").value;
      if (!name) { document.getElementById("timelineNameInput").focus(); return; }
      if (editingTimelineId) {
        const tl = timelines.find((x) => x.id === editingTimelineId);
        tl.name = name;
        tl.projectId = projectId;
        saveTimelines();
        closeTimelineModal();
        renderTimelinesSidebar();
        if (currentView === "timelines") renderTimelineView();
      } else {
        const nt = { id: uid(), name, projectId, bars: [] };
        timelines.push(nt);
        saveTimelines();
        closeTimelineModal();
        selectView("timelines", nt.id);
      }
    }
    function deleteTimeline() {
      if (!editingTimelineId) return;
      if (!confirm("Delete this timeline and all its Gantt bars?")) return;
      const wasCur = currentTimelineId === editingTimelineId;
      timelines = timelines.filter((x) => x.id !== editingTimelineId);
      if (wasCur) currentTimelineId = timelines[0] ? timelines[0].id : null;
      saveTimelines();
      closeTimelineModal();
      renderTimelinesSidebar();
      if (currentView === "timelines") renderTimelineView();
    }

    document.getElementById("timelinesNav").addEventListener("click", (e) => {
      if (e.target.id === "addTimelinesBtn") return;
      selectView("timelines");
    });
    document.getElementById("addTimelinesBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      openTimelineModal(null);
    });
    document.getElementById("timelineSave").addEventListener("click", saveTimeline);
    document.getElementById("timelineCancel").addEventListener("click", closeTimelineModal);
    document.getElementById("timelineDelete").addEventListener("click", deleteTimeline);
    timelineOverlay.addEventListener("click", (e) => { if (e.target === timelineOverlay) closeTimelineModal(); });
    document.addEventListener("keydown", (e) => {
      if (timelineOverlay.classList.contains("hidden")) return;
      if (e.key === "Escape") closeTimelineModal();
      if (e.key === "Enter") saveTimeline();
    });

    /* ---------- Gantt bar modal ---------- */
    let editingBarTL = null, editingBarId = null, barColorSel = "#6b5ecb";
    const barOverlay = document.getElementById("barModalOverlay");
    function renderBarSwatches() {
      const el = document.getElementById("barSwatches");
      el.innerHTML = "";
      BAR_COLORS.forEach((c) => {
        const s = document.createElement("div");
        s.className = "swatch" + (c === barColorSel ? " selected" : "");
        s.style.background = c;
        s.addEventListener("click", () => { barColorSel = c; renderBarSwatches(); });
        el.appendChild(s);
      });
    }
    function openBarModal(tlId, barId) {
      editingBarTL = tlId;
      editingBarId = barId || null;
      const tl = timelines.find((x) => x.id === tlId);
      const b = barId ? (tl.bars || []).find((x) => x.id === barId) : null;
      document.getElementById("barModalTitle").textContent = b ? "Edit task" : "Add task";
      document.getElementById("barLabelInput").value = b ? b.label : "";
      document.getElementById("barStartInput").value = b ? b.start : toISODate(new Date());
      document.getElementById("barEndInput").value = b ? b.end : addDaysISO(3);
      const prog = b ? b.progress || 0 : 0;
      document.getElementById("barProgressInput").value = prog;
      document.getElementById("barProgressVal").textContent = prog;
      barColorSel = b ? b.color || "#6b5ecb" : "#6b5ecb";
      renderBarSwatches();
      document.getElementById("barDelete").classList.toggle("hidden", !b);
      barOverlay.classList.remove("hidden");
      setTimeout(() => document.getElementById("barLabelInput").focus(), 50);
    }
    function closeBarModal() {
      barOverlay.classList.add("hidden");
      editingBarTL = null;
      editingBarId = null;
    }
    function saveBar() {
      const label = document.getElementById("barLabelInput").value.trim();
      let start = document.getElementById("barStartInput").value;
      let end = document.getElementById("barEndInput").value;
      const progress = parseInt(document.getElementById("barProgressInput").value, 10) || 0;
      if (!label) { document.getElementById("barLabelInput").focus(); return; }
      if (!start || !end) { alert("Please set both a start and end date."); return; }
      if (end < start) { const tmp = start; start = end; end = tmp; }
      const tl = timelines.find((x) => x.id === editingBarTL);
      if (!tl) { closeBarModal(); return; }
      if (!tl.bars) tl.bars = [];
      if (editingBarId) {
        const b = tl.bars.find((x) => x.id === editingBarId);
        Object.assign(b, { label, start, end, progress, color: barColorSel });
      } else {
        tl.bars.push({ id: uid(), label, start, end, progress, color: barColorSel });
      }
      saveTimelines();
      closeBarModal();
      renderTimelineView();
    }
    function deleteBar() {
      if (!editingBarTL || !editingBarId) return;
      const tl = timelines.find((x) => x.id === editingBarTL);
      if (tl) {
        tl.bars = (tl.bars || []).filter((x) => x.id !== editingBarId);
        saveTimelines();
      }
      closeBarModal();
      renderTimelineView();
    }
    document.getElementById("barProgressInput").addEventListener("input", (e) => {
      document.getElementById("barProgressVal").textContent = e.target.value;
    });
    document.getElementById("barSave").addEventListener("click", saveBar);
    document.getElementById("barCancel").addEventListener("click", closeBarModal);
    document.getElementById("barDelete").addEventListener("click", deleteBar);
    barOverlay.addEventListener("click", (e) => { if (e.target === barOverlay) closeBarModal(); });
    document.addEventListener("keydown", (e) => {
      if (barOverlay.classList.contains("hidden")) return;
      if (e.key === "Escape") closeBarModal();
      if (e.key === "Enter" && e.target.type !== "range") saveBar();
    });

    /* ---------- Go ---------- */
    render();
  </script>
</body>

</html>
